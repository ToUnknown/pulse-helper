[package]
name = "pulse-media"
version = "0.1.2"
edition = "2021"
publish = false

[dependencies]
gstreamer = { version = "0.24", features = ["v1_26"] }
gstreamer-sdp = { version = "0.24", features = ["v1_26"] }
gstreamer-rtp = { version = "0.24", features = ["v1_26"] }
gstreamer-webrtc = { version = "0.24", features = ["v1_26"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"

tungstenite = "0.28"
url = "2"

[profile.release]
lto = "thin"
strip = true

[build-dependencies]
cc = "1"
pkg-config = "0.3"
